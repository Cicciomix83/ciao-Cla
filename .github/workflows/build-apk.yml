name: Compila APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CiaoCla-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CiaoCla.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima CiaoCla.apk --title "Ciao Cla - ultima versione" --notes "Scarica CiaoCla.apk e aprilo sul telefono per installarlo."
